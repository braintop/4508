<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="איור של שיעור סטודיו בחדר כושר">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#f7f9fd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde5f3"/>
      <stop offset="100%" stop-color="#c9d5ea"/>
    </linearGradient>
    <linearGradient id="matA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="matB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- רקע -->
  <rect width="800" height="520" fill="url(#sky)"/>

  <!-- חלונות הסטודיו -->
  <g opacity="0.75">
    <rect x="70" y="60" width="180" height="210" rx="10" fill="#ffffff" stroke="#d7e0f0" stroke-width="3"/>
    <line x1="160" y1="60" x2="160" y2="270" stroke="#d7e0f0" stroke-width="3"/>
    <rect x="550" y="60" width="180" height="210" rx="10" fill="#ffffff" stroke="#d7e0f0" stroke-width="3"/>
    <line x1="640" y1="60" x2="640" y2="270" stroke="#d7e0f0" stroke-width="3"/>
  </g>

  <!-- שעון קיר -->
  <g transform="translate(400,120)">
    <circle r="42" fill="#ffffff" stroke="#c9d5ea" stroke-width="4"/>
    <circle r="3.5" fill="#2563eb"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#16202f" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="19" y2="10" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- רצפה -->
  <rect x="0" y="330" width="800" height="190" fill="url(#floor)"/>
  <path d="M0 330 H800" stroke="#b8c6df" stroke-width="3"/>

  <!-- מזרנים -->
  <g>
    <rect x="95" y="392" width="170" height="26" rx="13" fill="url(#matA)" opacity="0.9"/>
    <rect x="315" y="404" width="180" height="28" rx="14" fill="url(#matB)" opacity="0.92"/>
    <rect x="548" y="392" width="170" height="26" rx="13" fill="url(#matA)" opacity="0.9"/>
  </g>

  <!-- מתאמנת שמאלית: תנוחת יוגה -->
  <g stroke="#16202f" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="150" cy="286" r="17" fill="#16202f" stroke="none"/>
    <path d="M150 303 V350"/>
    <path d="M150 316 L118 296 M150 316 L182 296"/>
    <path d="M150 350 L122 392 M150 350 L182 392"/>
  </g>

  <!-- מדריכה מרכזית: ידיים למעלה -->
  <g stroke="#2563eb" stroke-width="10" stroke-linecap="round" fill="none">
    <circle cx="405" cy="276" r="20" fill="#2563eb" stroke="none"/>
    <path d="M405 296 V360"/>
    <path d="M405 312 L368 272 M405 312 L442 272"/>
    <path d="M405 360 L372 404 M405 360 L440 404"/>
  </g>

  <!-- מתאמנת ימנית: כיפוף צד -->
  <g stroke="#16202f" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="640" cy="288" r="17" fill="#16202f" stroke="none"/>
    <path d="M640 305 Q650 330 636 352"/>
    <path d="M642 318 L672 300 M642 318 L612 302"/>
    <path d="M636 352 L610 392 M636 352 L668 392"/>
  </g>

  <!-- משקולות יד -->
  <g fill="#8a94a6">
    <rect x="268" y="448" width="52" height="11" rx="5.5"/>
    <rect x="260" y="441" width="13" height="25" rx="4"/>
    <rect x="315" y="441" width="13" height="25" rx="4"/>
    <rect x="492" y="452" width="46" height="10" rx="5"/>
    <rect x="485" y="446" width="12" height="22" rx="4"/>
    <rect x="533" y="446" width="12" height="22" rx="4"/>
  </g>

  <!-- כדור פיזיו -->
  <circle cx="748" cy="472" r="34" fill="#bfd4fb" stroke="#93b4f7" stroke-width="4"/>
  <path d="M726 452 Q748 472 726 492" stroke="#93b4f7" stroke-width="3" fill="none"/>
</svg>
